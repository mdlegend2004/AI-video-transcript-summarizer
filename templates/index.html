<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <!-- Background grid -->
  <div class="bg-grid"></div>
  <div class="noise"></div>

  <header>
    <div class="logo">
      <span class="logo-icon">▶</span>
      <span class="logo-text">YT<em>Sum</em></span>
    </div>
    <nav>
      <button class="nav-btn active" data-tab="summarize">Summarize</button>
      <button class="nav-btn" data-tab="history">History</button>
    </nav>
  </header>

  <main>
    <!-- ── Summarize Tab ── -->
    <section id="tab-summarize" class="tab active">
      <div class="hero">
        <h1>Turn any YouTube video<br /><em>into insight.</em></h1>
        <p class="subtitle">Paste a link. Pick a style. Get a sharp summary.</p>
      </div>

      <div class="card form-card">
        <div class="field">
          <label for="url-input">YouTube URL</label>
          <div class="input-row">
            <span class="input-icon">🔗</span>
            <input id="url-input" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" spellcheck="false" />
          </div>
        </div>

        <div class="field">
          <label>Summary Style</label>
          <div class="style-grid">
            {% for key, style in styles.items() %}
            <label class="style-card {% if key == '1' %}selected{% endif %}">
              <input type="radio" name="style" value="{{ key }}" {% if key == '1' %}checked{% endif %} />
              <span class="style-num">{{ key }}</span>
              <span class="style-name">{{ style.label }}</span>
            </label>
            {% endfor %}
          </div>
        </div>

        <button id="submit-btn" class="btn-primary">
          <span class="btn-text">Generate Summary</span>
          <span class="btn-arrow">→</span>
        </button>
      </div>

      <!-- Progress panel -->
      <div id="progress-panel" class="card progress-card hidden">
        <div class="progress-header">
          <div class="pulse-dot"></div>
          <span id="progress-title">Processing…</span>
        </div>
        <div id="log-feed" class="log-feed"></div>
        <div class="progress-bar-wrap">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <!-- Result panel -->
      <div id="result-panel" class="card result-card hidden">
        <div class="result-header">
          <div class="result-meta">
            <h2 id="result-title"></h2>
            <span id="result-style-badge" class="badge"></span>
          </div>
          <div class="result-actions">
            <button id="tts-btn" class="btn-icon" title="Read summary aloud">▶</button>
            <button id="copy-btn" class="btn-icon" title="Copy summary">📋</button>
            <button id="download-btn" class="btn-icon" title="Download .txt">⬇</button>
            <button id="new-btn" class="btn-secondary">New Summary</button>
          </div>
        </div>
        <div id="result-summary" class="summary-content"></div>
        <details class="transcript-details">
          <summary>View full transcript</summary>
          <div id="result-transcript" class="transcript-content"></div>
        </details>
        <div class="result-footer">
          <span id="result-word-count" class="word-count"></span>
        </div>
      </div>

      <!-- Error panel -->
      <div id="error-panel" class="card error-card hidden">
        <div class="error-icon">⚠️</div>
        <p id="error-msg"></p>
        <button id="error-retry-btn" class="btn-secondary">Try Again</button>
      </div>
    </section>

    <!-- ── History Tab ── -->
    <section id="tab-history" class="tab hidden">
      <div class="history-header">
        <h2>Past Summaries</h2>
        <button id="refresh-history-btn" class="btn-icon" title="Refresh">↺</button>
      </div>
      <div id="history-list" class="history-list">
        <div class="history-empty">Loading history…</div>
      </div>
    </section>
  </main>


  <script src="/static/js/app.js"></script>
</body>
</html>
